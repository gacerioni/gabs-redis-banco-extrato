# Server block do nginx pra demo Itaú Extrato.
#
# A app interna escuta em 127.0.0.1:5218 (docker-compose cloud bind-mode).
# certbot adiciona o bloco SSL automaticamente depois com:
#   sudo certbot --nginx -d <seu-dominio>
#
# Trocar `extrato.platformengineer.io` pelo seu domínio antes de subir.

server {
    server_name extrato.platformengineer.io;

    # ACME challenge pro Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Proxy pra container da API (port 5218 no loopback, via docker bind 127.0.0.1)
    location / {
        proxy_pass http://127.0.0.1:5218;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}
